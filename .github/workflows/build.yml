name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o RuPillars.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: |
          gradle build --console=plain > build.log 2>&1 || { echo "=== ОШИБКИ СБОРКИ ==="; grep -B1 -A4 "error:" build.log | head -120; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: RuPillars
          path: build/libs/RuPillars.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          files: build/libs/RuPillars.jar
